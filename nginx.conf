server {
    listen 80;
    server_name trade.jtcml.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trade.jtcml.com;

    # SSL Certificates (Cloudflare Origin CA)
    ssl_certificate /home/ubuntu/.openclaw/workspace/platform/jt-ai-trading-platform/certs/trade_jtcml_cert.pem;
    ssl_certificate_key /home/ubuntu/.openclaw/workspace/platform/jt-ai-trading-platform/certs/trade_jtcml_key.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/trade.jtcml.com.access.log;
    error_log /var/log/nginx/trade.jtcml.com.error.log;

    # Backend API (FastAPI) - /api/ routes (MUST be before frontend)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Backend API (FastAPI) - /v1/api/ routes (IBKR web service)
    location /v1/api/ {
        proxy_pass http://127.0.0.1:8000/v1/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Backend Docs (Swagger UI)
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (React App) - URL-based routing for /paper/* and /sim/*
    # Using rewrite to strip prefix and serve from dist folder
    location ~ ^/(paper|sim)(/.*)?$ {
        root /var/www/trade.jtcml.com;
        try_files $2 $2/ /index.html;
        # Prevent ALL caching
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Root path - redirect to /sim/command by default
    location = / {
        return 302 /sim/command;
    }

    # App bundle files v6 (cache-busted)
    location ~ ^/app\.v[0-9]+\.(js|css)$ {
        root /var/www/trade.jtcml.com;
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "-1" always;
        try_files $uri =404;
    }

    # Static assets v2 - allow both old and new paths during transition
    location ~ ^/assets(_v2)?/.*\.(js|css)$ {
        root /var/www/trade.jtcml.com;
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "-1" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static assets and fallback for unmatched paths
    location / {
        root /var/www/trade.jtcml.com;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Prevent ALL caching
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
