server {
    listen 80;
    server_name trade.jtcml.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trade.jtcml.com;

    # SSL Certificates (Cloudflare Origin CA)
    ssl_certificate /home/ubuntu/.openclaw/workspace/jt-ai-trading-platform/certs/trade_jtcml_cert.pem;
    ssl_certificate_key /home/ubuntu/.openclaw/workspace/jt-ai-trading-platform/certs/trade_jtcml_key.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/trade.jtcml.com.access.log;
    error_log /var/log/nginx/trade.jtcml.com.error.log;

    # Frontend (React App) - Static files
    location / {
        root /home/ubuntu/.openclaw/workspace/jt-ai-trading-platform/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API (FastAPI) - /api/ routes
    # IMPORTANT: proxy_pass must include /api/ to preserve the path
    # WRONG: proxy_pass http://127.0.0.1:8000/;  (strips /api/)
    # CORRECT: proxy_pass http://127.0.0.1:8000/api/;  (preserves /api/)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Backend API (FastAPI) - /v1/api/ routes (IBKR web service)
    location /v1/api/ {
        proxy_pass http://127.0.0.1:8000/v1/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Backend Docs (Swagger UI)
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
