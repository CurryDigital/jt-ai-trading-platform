<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/trading_logo.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>JTCML Trading</title>
    <script>
      // Clear any stale PWA/service-worker cache from previous builds so new deployments take effect on the next visit.
      // We do NOT reload here: a reload during a React Router navigation can reset state and strand the user on the default route.
      if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
    </script>
    <script>
      // Stale-bundle self-heal (2026-10-06): a tab left open across a deploy
      // keeps the OLD JS bundle in memory (hashed assets never refetch until
      // reload). Poll version.json and hard-reload once the served build hash
      // no longer matches the entry bundle this page loaded. Dev mode (entry
      // is /src/main.jsx, not /assets/index-*) is exempt.
      (function () {
        function entrySrc() {
          var s = document.querySelector('script[type="module"][src*="/assets/index-"]');
          return s ? s.src : null;
        }
        function check() {
          var src = entrySrc();
          if (!src) return;
          fetch('/version.json?ts=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (v) {
              if (v && v.build && src.indexOf(v.build) === -1) location.reload();
            })
            .catch(function () {});
        }
        setInterval(check, 60000);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
        window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
