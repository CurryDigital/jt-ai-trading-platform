documentation:
  strategy_logic: |
    The 3-Day Reversal strategy exploits short-term overreaction in equities.
    When a stock drops >3% over 3 days with above-average volume, it often
    experiences a mean-reversion bounce. Similarly, stocks that rise >3% over
    3 days often pull back. The strategy enters on these signals and holds
    for 3 days.
    
  assumptions: |
    1. Markets exhibit short-term mean reversion
    2. Volume confirms the price move (not just noise)
    3. 3-day window captures overreaction without being too short
    4. S&P 500 and Russell 1000 have sufficient liquidity
    
  limitations: |
    1. May underperform in strong trending markets
    2. Requires daily rebalancing (higher turnover)
    3. Short-term strategies have higher transaction costs
    4. Correlation with other mean reversion strategies
    
  academic_references: |
    - Poterba, J.M., & Summers, L.H. (1988). Mean reversion in stock prices.
    - Jegadeesh, N. (1990). Evidence of predictable behavior of security returns.

