# 3-Day Reversal Strategy
# Mean reversion strategy exploiting short-term overreaction in equities

strategy:
  name: "3-Day Reversal"
  id: "three_day_reversal_v1"
  version: "1.0.0"
  description: "Mean reversion strategy that enters after 3-day price moves >3% with volume confirmation"
  author: "Trade Algo Researcher"
  created_date: "2026-02-20"
  last_modified: "2026-02-20"
  
classification:
  asset_class: "equities"
  direction: "long_short"
  time_horizon: "short_term"
  holding_period: "3_days"
  style: "mean_reversion"
  rebalancing: "continuous"
  
universe:
  primary:
    index: "S&P 500"
    tickers: null  # Use full index
  secondary:
    index: "Russell 1000"
    tickers: null
  filters:
    min_price: 5.0
    max_price: null
    min_volume: 1000000
    min_market_cap: null
    exclude_sectors: []
    exclude_tickers: ["VIX", "UVXY", "SVXY"]  # Exclude volatility products
  
trading_logic:
  entry_signals:
    long:
      condition: "close < close[3] * 0.97"
      description: "Price dropped >3% over 3 days"
      volume_filter:
        enabled: true
        condition: "volume > volume[1] * 1.2"
        description: "Volume > 20% above previous day"
    short:
      condition: "close > close[3] * 1.03"
      description: "Price rose >3% over 3 days"
      volume_filter:
        enabled: true
        condition: "volume > volume[1] * 1.2"
        description: "Volume > 20% above previous day"
    
  exit_signals:
    time_based:
      enabled: true
      hold_days: 3
      description: "Exit after 3 trading days"
    stop_loss:
      enabled: true
      type: "percent"
      value: 0.05
      description: "5% stop loss from entry"
    take_profit:
      enabled: true
      type: "percent"
      value: 0.03
      description: "3% take profit from entry"
    
  position_sizing:
    method: "fixed_dollar"
    fixed_dollar_amount: 10000
    max_portfolio_pct: 0.05
    max_concurrent_positions: 5
    max_total_exposure: 0.20
    
  order_execution:
    entry_order_type: "MOC"  # Market on Close
    entry_timing: "5_minutes_before_close"
    exit_order_type: "MOC"
    time_in_force: "DAY"
    
risk_management:
  daily_loss_limit:
    enabled: true
    threshold: 0.02
    description: "Halt trading if daily loss > 2%"
  correlation_check:
    enabled: true
    max_correlation: 0.70
    description: "Skip trade if correlated position exists"
  sector_exposure_limit:
    enabled: true
    max_sector_pct: 0.25
  single_stock_limit:
    enabled: true
    max_single_stock_pct: 0.05

backtesting:
  period:
    start: "2021-01-01"
    end: "2024-12-31"
  data_source: "silver.historical_stock_data"
  benchmark: "SPY"
  
  parameters_tested:
    lookback_days: [3, 5, 10]
    threshold_pct: [0.03, 0.05, 0.07]
    hold_days: [3, 5, 10]
    volume_multiplier: [1.0, 1.2, 1.5]
    
  optimal_parameters:
    lookback_days: 3
    threshold_pct: 0.03
    hold_days: 3
    volume_multiplier: 1.2
    
  results:
    total_trades: 281
    win_rate: 61.2
    avg_return: 1.45
    sharpe_ratio: 2.06
    max_drawdown: -12.3
    profit_factor: 2.14
    calmar_ratio: 0.17
    
  transaction_costs:
    commission_per_share: 0.005
    slippage_pct: 0.05

code:
  backtest_script: |
    def backtest_3day_reversal(df, params):
        trades = []
        for ticker in df['ticker'].unique():
            ticker_df = df[df['ticker'] == ticker].sort_values('date')
            ticker_df['ret_3d'] = ticker_df['close'].pct_change(3)
            ticker_df['vol_ratio'] = ticker_df['volume'] / ticker_df['volume'].shift(1)
            ticker_df['future_ret'] = ticker_df['close'].pct_change(3).shift(-3)
            
            for i in range(3, len(ticker_df) - 3):
                row = ticker_df.iloc[i]
                # Long signal
                if row['ret_3d'] < -0.03 and row['vol_ratio'] > 1.2:
                    trades.append({
                        'ticker': ticker,
                        'date': ticker_df.index[i],
                        'signal': 'LONG',
                        'entry_price': row['close'],
                        'exit_price': ticker_df.iloc[i+3]['close'],
                        'return': (ticker_df.iloc[i+3]['close'] / row['close'] - 1) * 100
                    })
                # Short signal
                elif row['ret_3d'] > 0.03 and row['vol_ratio'] > 1.2:
                    trades.append({
                        'ticker': ticker,
                        'date': ticker_df.index[i],
                        'signal': 'SHORT',
                        'entry_price': row['close'],
                        'exit_price': ticker_df.iloc[i+3]['close'],
                        'return': -(ticker_df.iloc[i+3]['close'] / row['close'] - 1) * 100
                    })
        return pd.DataFrame(trades)

