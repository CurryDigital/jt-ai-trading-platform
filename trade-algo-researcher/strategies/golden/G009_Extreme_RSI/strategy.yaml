# G009: Extreme RSI Mean Reversion Strategy
strategy_id: G009
name: Extreme RSI Mean Reversion
version: "1.0.0"
status: golden
jt_integration: true
last_modified: "2026-02-26T14:00:00Z"

description: |
  Universal mean reversion strategy that enters when RSI drops below 25 
  (extreme oversold) and exits when RSI recovers above 50. Validated on 
  204 tickers across US, HK, CN, and SG markets with full 3-tier 
  walk-forward validation.

classification:
  tier: golden
  path: A (High Win Rate)
  win_rate_threshold: 50%
  profit_factor_threshold: 1.3
  sharpe_threshold: 0.8
  max_dd_threshold: 20%

universe:
  primary: ["0005.HK", "0700.HK", "0001.HK", "0939.HK", "SPY", "QQQ", "IWM", 
            "AAPL", "MSFT", "GOOGL", "NVDA", "TSLA", "META", "AMD", 
            "601988.SS", "601088.SS", "300760.SZ", "3988.HK", "3328.HK"]
  extended: 204_tickers_universal
  markets: [US, HK, CN, SG]
  asset_classes: [equity, etf, adr]

entry_conditions:
  - indicator: rsi
    period: 14
    condition: "<"
    threshold: 25
    description: "Extreme oversold condition"

exit_conditions:
  primary:
    - indicator: rsi
      period: 14
      condition: ">"
      threshold: 50
      description: "RSI recovery to neutral"
  secondary:
    - type: time_exit
      days: 10
      description: "Maximum hold period"

position_sizing:
  method: fixed_percentage
  max_position_pct: 3.0
  max_sector_pct: 15.0

risk_management:
  stop_loss_pct: null
  max_drawdown_strategy: 15.0
  max_drawdown_portfolio: 20.0

backtest_results:
  period: "2021-2024"
  total_trades: 3358
  win_rate: 54.1
  profit_factor: 1.28
  sharpe_ratio: 1.15
  max_drawdown: 14.5
  avg_hold_days: 8.9
  cagr: 23.5
  
  train_metrics:
    period: "2021-2022"
    trades: 1717
    win_rate: 51.7
    profit_factor: 1.14
    sharpe: 1.05
    max_dd: 12.0
    
  test_metrics:
    period: "2023-2024"
    trades: 1641
    win_rate: 56.5
    profit_factor: 1.48
    sharpe: 1.25
    max_dd: 10.5
    decay_vs_train: -9.2  # Negative = improved

  top_performers:
    - ticker: "ABBV"
      trades: 13
      win_rate: 84.6
    - ticker: "USDJPY=X"
      trades: 11
      win_rate: 81.8
    - ticker: "601988.SS"
      trades: 5
      win_rate: 80.0
    - ticker: "300760.SZ"
      trades: 14
      win_rate: 78.6
    - ticker: "UNH"
      trades: 16
      win_rate: 75.0

signal_generation:
  schedule: "09:00 HKT"
  timezone: "Asia/Hong_Kong"
  sql_query: |
    SELECT ticker, 'BUY' as signal, date, close, rsi_14
    FROM gold.stock_metrics
    WHERE rsi_14 < 25
    AND date = CURRENT_DATE
    AND volume > 1000000
    ORDER BY rsi_14 ASC
    LIMIT 10;

validation_status:
  backtest_verified: true
  data_source: "silver.unified_prices (RDS)"
  walk_forward_tested: true
  train_period: "2021-2022"
  test_period: "2023-2024"
  oos_validated: true
  decay_threshold_met: true
  qa_approved: false
  deployed: false

enhancement_roadmap:
  - volume_filter: "Test rel_vol > 1.5x"
  - trend_filter: "Test Price > SMA50"
  - multi_timeframe: "Test RSI(7) confirmation"
  - sector_optimization: "Sector-specific thresholds"

notes: |
  - Universal strategy works across 204 tickers
  - Generates ~3-4 trades per month per ticker
  - Negative decay = improved performance in recent period
  - Volume filter enhancement pending test
  - Top sectors: Healthcare, China Banks, FX pairs
