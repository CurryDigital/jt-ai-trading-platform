# G007: BB RSI15 Monday Strategy
strategy_id: G007
name: BB RSI15 Monday
version: "1.0.0"
status: golden
jt_integration: true
last_modified: "2026-02-26T14:00:00Z"

description: |
  Multi-factor mean reversion strategy combining Bollinger Band extremes, 
  RSI oversold, volume spike, and Monday effect. High conviction setup 
  with strong historical edge.

classification:
  tier: golden
  path: A (High Win Rate)
  win_rate_threshold: 70%
  profit_factor_threshold: 1.5
  sharpe_threshold: 1.5
  max_dd_threshold: 15%

universe:
  primary: ["SPY", "QQQ", "IWM", "XLF", "XLK", "XLV", "XLI", "XLU"]
  extended: US_large_cap_etfs
  market: US
  asset_class: etf

entry_conditions:
  - indicator: bb_pct_b
    condition: "<"
    threshold: 0.15
    description: "Price below lower Bollinger Band"
  - indicator: rsi
    period: 14
    condition: "<"
    threshold: 20
  - indicator: relative_volume
    condition: ">"
    threshold: 1.5
  - indicator: day_of_week
    condition: "=="
    value: "Monday"

exit_conditions:
  primary:
    - indicator: bb_pct_b
      condition: ">"
      threshold: 0.50
  secondary:
    - type: time_exit
      days: 5

position_sizing:
  method: fixed_percentage
  max_position_pct: 4.0
  max_sector_pct: 15.0

risk_management:
  stop_loss_pct: null
  max_drawdown_strategy: 12.0
  max_drawdown_portfolio: 20.0

backtest_results:
  period: "2021-2024"
  total_trades: 66
  win_rate: 72.7
  profit_factor: 2.1
  sharpe_ratio: 1.8
  max_drawdown: 10.0
  avg_hold_days: 3.8
  cagr: 28.0

train_metrics:
  period: "2021-2022"
  trades: 34
  win_rate: 70.6
  profit_factor: 1.9

test_metrics:
  period: "2023-2024"
  trades: 32
  win_rate: 75.0
  profit_factor: 2.4
  decay_vs_train: -6.2

signal_generation:
  schedule: "Monday 09:00 HKT"
  sql_query: |
    SELECT ticker, 'BUY' as signal
    FROM gold.stock_metrics
    WHERE (close - lower_bb) / (upper_bb - lower_bb) < 0.15
    AND rsi_14 < 20
    AND relative_vol_10d > 1.5
    AND EXTRACT(DOW FROM date) = 1

validation_status:
  backtest_verified: true
  walk_forward_tested: true
  qa_approved: false
  deployed: false
