# Momentum Lifecycle Strategy
# Classic momentum strategy based on Jegadeesh & Titman (1993, 2001)

strategy:
  name: "Momentum Lifecycle"
  id: "momentum_lifecycle_v1"
  version: "1.0.0"
  description: "Long-only momentum strategy buying top-performing stocks over 12-1 month formation period"
  author: "Trade Algo Researcher"
  created_date: "2026-02-20"
  last_modified: "2026-02-20"
  
classification:
  asset_class: "equities"
  direction: "long_only"
  time_horizon: "medium_term"
  holding_period: "1_month"
  style: "momentum"
  rebalancing: "monthly"
  
universe:
  primary:
    index: "Russell 1000"
    tickers: null
  secondary:
    index: "S&P 500"
    tickers: null
  filters:
    min_price: 5.0
    max_price: null
    min_volume: 500000
    min_market_cap: null
    exclude_recent_ipo: 252  # Exclude IPOs < 1 year
    exclude_sectors: []
    exclude_tickers: []
  
trading_logic:
  signal_calculation:
    description: "Calculate momentum over 12-month formation period, excluding most recent month"
    formation_period_days: 252  # 12 months
    skip_period_days: 21       # 1 month (avoids short-term reversal)
    formula: "(close[t-21] - close[t-252]) / close[t-252]"
    description_detailed: "Returns from month -12 to month -1 (skip most recent month)"
    
  ranking:
    method: "descending"
    metric: "momentum_12_1"
    selection: "top_decile"
    num_stocks: 50  # Top 10% of ~500 stock universe
    
  entry_signals:
    monthly_rebalance:
      trigger: "first_trading_day_of_month"
      action: "BUY top 50 momentum stocks"
      weighting: "equal_weight"
      description: "Enter equal-weighted portfolio of top momentum decile"
      
  exit_signals:
    monthly_rebalance:
      trigger: "first_trading_day_of_next_month"
      action: "SELL previous month positions"
      description: "Liquidate and rebalance to new top 50"
      
    stop_loss:
      enabled: true
      type: "trailing"
      value: 0.10
      description: "10% trailing stop loss per position"
      
  position_sizing:
    method: "equal_weight"
    num_positions: 50
    position_value: null  # Calculated as Portfolio / 50
    max_position_value: 5000
    max_portfolio_exposure: 1.0  # Fully invested
    min_position_value: 1000
    
  order_execution:
    entry_order_type: "MOC"
    entry_timing: "first_trading_day_of_month"
    exit_order_type: "MOC"
    time_in_force: "DAY"
    batch_orders: true
    
risk_management:
  sector_limits:
    enabled: true
    max_sector_pct: 0.25
    description: "Max 25% in any single sector"
    
  stop_loss:
    enabled: true
    type: "percent"
    value: 0.10
    description: "10% stop loss per position"
    
  correlation_check:
    enabled: false  # Handled by diversification (50 positions)
    
  position_concentration:
    enabled: true
    max_single_stock_pct: 0.05
    description: "Max 5% in any single stock"
    
  daily_loss_limit:
    enabled: true
    threshold: 0.03
    description: "Alert if daily loss > 3%"

