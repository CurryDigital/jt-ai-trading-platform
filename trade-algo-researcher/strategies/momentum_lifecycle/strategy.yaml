documentation:
  strategy_logic: |
    The Momentum Lifecycle strategy implements the classic momentum effect
    documented by Jegadeesh & Titman (1993, 2001). The strategy ranks stocks
    by their past 12-month returns (excluding the most recent month to avoid
    short-term reversal), and buys the top-performing decile. Positions are
    held for one month and then rebalanced.
    
    Key insight: Stocks that performed well over the past 12 months (excluding
    the most recent month) tend to continue outperforming over the next month.
    The skip month avoids the short-term reversal effect documented in
    microstructure literature.
    
  academic_references: |
    Jegadeesh, N., & Titman, S. (1993). Returns to buying winners and selling
    losers: Implications for stock market efficiency. Journal of Finance, 48(1), 65-91.
    
    Jegadeesh, N., & Titman, S. (2001). Profitability of momentum strategies:
    An evaluation of alternative explanations. Journal of Finance, 56(2), 699-720.
    
    Asness, C. S. (1994). Variables that explain stock returns. PhD dissertation,
    University of Chicago.
    
  rationale: |
    Momentum is one of the most robust anomalies in finance. Behavioral
    explanations suggest investors underreact to new information initially
    and then overreact as trends develop, creating predictable patterns.
    The 12-1 formation period captures medium-term trends while avoiding
    the short-term reversal and long-term mean reversion effects.
    
  assumptions: |
    1. Momentum anomaly persists in the market
    2. 12-month formation captures sustained trends
    3. 1-month skip avoids short-term reversal
    4. Monthly rebalancing is cost-effective
    5. Large/mid cap stocks (Russell 1000) have sufficient liquidity
    
  limitations: |
    1. Momentum crashes during market reversals (e.g., 2009, 2020)
    2. High turnover (100%+ annually) creates transaction costs
    3. Concentration risk in trending sectors
    4. Underperforms during bear markets and recoveries
    5. Requires disciplined rebalancing (behavioral challenge)
    
  risk_factors: |
    - Momentum crashes (sharp reversals after long trends)
    - High beta during bull markets, crashes during transitions
    - Sector concentration (momentum often clusters in hot sectors)
    - Liquidity risk during stress periods

