code:
  backtest_script: |
    def backtest_momentum_lifecycle(stock_data, params):
        trades = []
        
        # Get all unique dates (monthly)
        all_dates = sorted(stock_data['date'].unique())
        rebalance_dates = [d for d in all_dates if d.day <= 5]  # First week of month
        
        for i, rebalance_date in enumerate(rebalance_dates[:-1]):
            next_rebalance = rebalance_dates[i + 1]
            
            # Calculate momentum for all stocks at rebalance date
            momentum_scores = []
            for ticker in stock_data['ticker'].unique():
                ticker_df = stock_data[stock_data['ticker'] == ticker].sort_values('date')
                
                # Get formation period prices
                current_data = ticker_df[ticker_df['date'] <= rebalance_date]
                if len(current_data) < params['formation_days'] + params['skip_days']:
                    continue
                
                current_price = current_data.iloc[-1 - params['skip_days']]['close']
                past_price = current_data.iloc[-1 - params['skip_days'] - params['formation_days']]['close']
                
                momentum = (current_price - past_price) / past_price
                momentum_scores.append({
                    'ticker': ticker,
                    'momentum': momentum,
                    'entry_price': current_data.iloc[-1]['close']
                })
            
            # Select top decile
            momentum_df = pd.DataFrame(momentum_scores)
            top_stocks = momentum_df.nlargest(params['num_positions'], 'momentum')
            
            # Calculate returns for next month
            for _, stock in top_stocks.iterrows():
                ticker = stock['ticker']
                entry_price = stock['entry_price']
                
                # Find exit price (next rebalance)
                ticker_df = stock_data[stock_data['ticker'] == ticker].sort_values('date')
                future_data = ticker_df[ticker_df['date'] > rebalance_date]
                if len(future_data) == 0:
                    continue
                
                exit_data = future_data[future_data['date'] <= next_rebalance]
                if len(exit_data) == 0:
                    exit_price = future_data.iloc[0]['close']
                else:
                    exit_price = exit_data.iloc[-1]['close']
                
                pnl = (exit_price - entry_price) / entry_price * 100
                trades.append({
                    'rebalance_date': rebalance_date,
                    'ticker': ticker,
                    'momentum': stock['momentum'],
                    'entry_price': entry_price,
                    'exit_price': exit_price,
                    'return': pnl
                })
        
        return pd.DataFrame(trades)

