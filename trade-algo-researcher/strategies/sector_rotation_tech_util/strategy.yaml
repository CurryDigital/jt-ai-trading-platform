documentation:
  strategy_logic: |
    The Sector Rotation Tech/Utilities strategy exploits the cyclical
    relationship between growth (Technology) and defensive (Utilities) sectors.
    When one sector significantly outperforms the other over a 20-day period
    (>5% spread), the strategy rotates capital to the underperforming sector,
    betting on mean reversion. This captures the "risk-on/risk-off" dynamic
    in equity markets.
    
  rationale: |
    Technology (XLK) represents growth/high-beta; Utilities (XLU) represents
    defensives/low-beta. These sectors often move in opposite directions
    during regime changes. Large spreads between them are typically followed
    by convergence as markets normalize.
    
  assumptions: |
    1. Tech and Utilities maintain negative correlation during regime shifts
    2. Large momentum spreads (>5%) are mean-reverting
    3. 20-day window captures medium-term momentum
    4. Sector ETFs have sufficient liquidity for rotation
    
  limitations: |
    1. Requires sustained sector trends; choppy markets reduce edge
    2. Only 2 sectors - limited diversification
    3. May miss broader market moves (beta neutral)
    4. Rotations can occur during major trend changes (whipsaw risk)
    
  macro_dependencies: |
    - Interest rate environment (affects both sectors)
    - Economic cycle phase
    - Risk appetite/risk aversion regimes

