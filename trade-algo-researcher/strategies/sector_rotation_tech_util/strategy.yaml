# Sector Rotation Tech/Utilities Strategy
# Rotates capital between technology (growth) and utilities (defensive) sectors

strategy:
  name: "Sector Rotation Tech/Utilities"
  id: "sector_rotation_tech_util_v1"
  version: "1.0.0"
  description: "Rotates between XLK (Technology) and XLU (Utilities) ETFs based on momentum spread"
  author: "Trade Algo Researcher"
  created_date: "2026-02-20"
  last_modified: "2026-02-20"
  
classification:
  asset_class: "etfs"
  direction: "long_only_rotation"  # Long one, flat/short the other
  time_horizon: "medium_term"
  holding_period: "20_days"
  style: "sector_rotation"
  rebalancing: "event_driven"
  
universe:
  primary:
    tickers: ["XLK", "XLU"]
    description: "XLK = Technology Select Sector, XLU = Utilities Select Sector"
  benchmark:
    ticker: "SPY"
    description: "S&P 500 ETF for beta reference"
  market: "US"
  filters:
    min_price: null  # ETFs only
    min_volume: 10000000  # High liquidity required
    
trading_logic:
  signal_calculation:
    description: "Calculate 20-day momentum spread between Tech and Utilities"
    lookback_days: 20
    formulas:
      xlk_momentum: "(XLK_close - XLK_close[20]) / XLK_close[20]"
      xlu_momentum: "(XLU_close - XLU_close[20]) / XLU_close[20]"
      spread: "xlk_momentum - xlu_momentum"
      
  entry_signals:
    rotate_to_utilities:
      condition: "spread > 0.05"
      description: "Tech outperformed Utilities by >5% - mean reversion play"
      action: "BUY XLU, REDUCE/SKIP XLK"
      position: "Long XLU only"
      
    rotate_to_tech:
      condition: "spread < -0.05"
      description: "Utilities outperformed Tech by >5% - mean reversion play"
      action: "BUY XLK, REDUCE/SKIP XLU"
      position: "Long XLK only"
      
  exit_signals:
    time_based:
      enabled: true
      hold_days: 20
      description: "Exit after 20 trading days"
      
    mean_reversion:
      enabled: true
      condition: "abs(spread) < 0.02"
      description: "Exit if spread normalizes to <2%"
      
    stop_loss:
      enabled: true
      type: "percent"
      value: 0.08
      description: "8% stop loss from entry"
      
  position_sizing:
    method: "fixed_dollar_per_leg"
    fixed_dollar_per_leg: 25000
    max_portfolio_pct: 0.40  # 20% long + 20% short hedge
    leverage: 1.0
    
  order_execution:
    entry_order_type: "MOC"
    entry_timing: "market_close"
    exit_order_type: "MOC"
    time_in_force: "DAY"
    
risk_management:
  beta_neutrality:
    enabled: true
    target_beta: 0.0
    description: "Strategy aims to be market neutral"
    
  sector_concentration:
    enabled: true
    max_sector_pct: 0.40
    description: "Max 40% in any single sector"
    
  stop_loss:
    enabled: true
    per_leg: 0.08
    portfolio: 0.10
    
  daily_loss_limit:
    enabled: true
    threshold: 0.02
    
  correlation_check:
    enabled: false  # N/A for this strategy (only 2 ETFs)

