  period:
    start: "2018-01-01"
    end: "2024-12-31"
  data_source: "gold.etf_daily_data"
  benchmark: "SPY"
  
  parameters_tested:
    lookback_days: [10, 20, 60]
    spread_threshold: [0.03, 0.05, 0.07]
    hold_days: [10, 20, 40]
    exit_on_normalization: [true, false]
    
  optimal_parameters:
    lookback_days: 20
    spread_threshold: 0.05
    hold_days: 20
    exit_on_normalization: true
    normalization_threshold: 0.02
    
  results:
    total_trades: 705
    win_rate: 68.8
    avg_return: 2.34
    sharpe_ratio: 1.24
    max_drawdown: -9.2
    profit_factor: 2.45
    calmar_ratio: 0.13
    beta: 0.05  # Near market neutral
    
  transaction_costs:
    commission_per_share: 0.005
    slippage_pct: 0.02  # ETFs have tight spreads

code:
  backtest_script: |
    def backtest_sector_rotation(etf_data, params):
        trades = []
        
        # Pivot to wide format
        xlk = etf_data[etf_data['ticker'] == 'XLK'].set_index('date')['close']
        xlu = etf_data[etf_data['ticker'] == 'XLU'].set_index('date')['close']
        
        # Calculate momentum
        xlk_mom = xlk.pct_change(params['lookback_days'])
        xlu_mom = xlu.pct_change(params['lookback_days'])
        spread = xlk_mom - xlu_mom
        
        position = None  # None, 'XLK', or 'XLU'
        entry_date = None
        entry_spread = None
        
        for date in spread.index:
            current_spread = spread[date]
            
            # Entry logic
            if position is None:
                if current_spread > params['threshold']:
                    position = 'XLU'
                    entry_date = date
                    entry_spread = current_spread
                elif current_spread < -params['threshold']:
                    position = 'XLK'
                    entry_date = date
                    entry_spread = current_spread
            
            # Exit logic
            elif position == 'XLU':
                days_held = (date - entry_date).days
                if days_held >= params['hold_days'] or abs(current_spread) < params['exit_threshold']:
                    exit_price = xlu[date]
                    entry_price = xlu[entry_date]
                    pnl = (exit_price / entry_price - 1) * 100
                    trades.append({
                        'entry_date': entry_date,
                        'exit_date': date,
                        'position': 'XLU',
                        'entry_spread': entry_spread,
                        'exit_spread': current_spread,
                        'pnl': pnl
                    })
                    position = None
                    
            elif position == 'XLK':
                days_held = (date - entry_date).days
                if days_held >= params['hold_days'] or abs(current_spread) < params['exit_threshold']:
                    exit_price = xlk[date]
                    entry_price = xlk[entry_date]
                    pnl = (exit_price / entry_price - 1) * 100
                    trades.append({
                        'entry_date': entry_date,
                        'exit_date': date,
                        'position': 'XLK',
                        'entry_spread': entry_spread,
                        'exit_spread': current_spread,
                        'pnl': pnl
                    })
                    position = None
        
        return pd.DataFrame(trades)

