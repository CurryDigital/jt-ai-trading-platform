name: "Crypto Funding Rate Arbitrage"
version: "1.0"
description: "Capture funding payments by shorting perp + long spot when funding is positive"

asset_class: "crypto"
direction: "neutral"
horizon: "short_term"

status: "backtested"
target_sharpe: 2.0
actual_sharpe: 2.5
target_max_dd: 0.10
actual_max_dd: 0.08
win_rate: 0.75
avg_hold_days: 1.0
capacity_millions: 50

universe:
  - "BTC"
  - "ETH"
  - "SOL"

signals:
  frequency: "hourly"
  rebalance: "as_needed"
